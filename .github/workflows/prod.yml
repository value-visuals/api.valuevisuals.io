name: Build & Push to DigitalOcean

on:
  push:
    branches:
      - main
      - qa
      - test
      - feature/automated-digitalocean-deployment
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: DIGITALOCEAN

    env:
      REGISTRY: registry.digitalocean.com/valuevisuals
      IMAGE_NAME: valuevisuals-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_PAT }}

      - name: Log in to DigitalOcean Container Registry
        run: |
          doctl registries login valuevisuals --expiry-seconds 1200

      - name: Set image tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "feature/automated-digitalocean-deployment" ]; then
            echo "TAG=test" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Show image destination
        run: |
          echo "Image: ${REGISTRY}/${IMAGE_NAME}:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
