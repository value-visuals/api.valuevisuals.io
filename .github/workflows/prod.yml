name: Build & Push to DigitalOcean

on:
  push:
    branches:
      - main
      - qa
      - test
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: DIGITALOCEAN

    env:
      REGISTRY: registry.digitalocean.com/valuevisuals
      IMAGE_NAME: valuevisuals-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_PAT }}

      - name: Log in to DigitalOcean Container Registry
        run: |
          doctl registries login valuevisuals --expiry-seconds 1200

      - name: Set image tag
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Show image destination
        run: |
          echo "Image: ${REGISTRY}/${IMAGE_NAME}:${TAG}"

      - name: Find current manifest for tag
        run: |
          OLD_DIGEST=$(doctl registries repository list-tags valuevisuals valuevisuals-api \
            --format Tag,ManifestDigest \
            --no-header | \
            awk -v tag="$TAG" '$1 == tag {print $2}')

          if [ -n "$OLD_DIGEST" ]; then
            echo "OLD_DIGEST=$OLD_DIGEST" >> "$GITHUB_ENV"
            echo "Existing $TAG image: $OLD_DIGEST"
          else
            echo "No existing $TAG image found."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Remove previous image for tag
        if: env.OLD_DIGEST != ''
        run: |
          echo "Removing previous $TAG image: $OLD_DIGEST"

          doctl registries repository delete-manifest \
            valuevisuals-api \
            "$OLD_DIGEST" \
            --force
